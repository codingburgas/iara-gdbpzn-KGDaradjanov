<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Купи билет - ИАРА</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        #ticketResult {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #0b3c5d, #328cc1);
            color: white;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            text-align: left;
            position: relative;
        }
        .ticket-header {
            font-size: 20px;
            font-weight: bold;
            border-bottom: 2px dashed rgba(255,255,255,0.5);
            padding-bottom: 10px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .ticket-detail {
            margin-bottom: 8px;
            font-size: 15px;
        }
        .ticket-detail strong {
            color: #d9e8f5;
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="logo">ИАРА</div>
    <ul class="nav-links">
        <li><a href="{{ url_for('index') }}">Начало</a></li>
        {% if session.get('username') %}
            <li><a href="{{ url_for('dashboard') }}">Моето табло</a></li>
            <li><a href="{{ url_for('logout') }}">Изход ({{ session['username'] }})</a></li>
        {% else %}
            <li><a href="{{ url_for('login') }}">Вход</a></li>
        {% endif %}
        <li><a href="{{ url_for('ticket') }}">Риболовен билет</a></li>
    </ul>
</nav>

<main>
    <div class="ticket-container">
        <h2>Купи риболовен билет</h2>

        <div class="input-group">
            <label for="age">Възрастова група</label>
            <select id="age" onchange="calculate()">
                <option value="adult">Над 14 г. (Стандартен)</option>
                <option value="child">Под 14 г. (50% отстъпка)</option>
                <option value="pensioner">Пенсионер (50% отстъпка)</option>
            </select>
        </div>

        <div class="input-group">
            <label for="duration">Продължителност на билета</label>
            <select id="duration" onchange="calculate()">
                <option value="day">1 Ден</option>
                <option value="week">1 Седмица</option>
                <option value="year">1 Година</option>
            </select>
        </div>

        <div class="input-group" style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
            <input type="checkbox" id="disabled" onchange="calculate()" style="width: auto; margin: 0;">
            <label for="disabled" style="margin: 0;">Инвалид (ТЕЛК) - Безплатно</label>
        </div>

        <h3 id="price" style="text-align: center; color: #328cc1; margin-bottom: 20px;">Цена: 5.0 €</h3>

        <button onclick="buy()">Закупи билет</button>

        <div id="ticketResult"></div>
    </div>
</main>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
<script src="{{ url_for('static', filename='js/ticket.js') }}"></script>

</body>
</html>
